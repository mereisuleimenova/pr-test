:root{
  --sky:#3a7fe0; --tb1:#2f6fe0; --tb2:#1a4fc2; --tbHi:#5b97f5; --edge:#0b3a9e;
  --face:#ece9d8; --face2:#d6d2bf; --ink:#1b1b1f; --muted:#5d5d66;
  --accent:#E8336F; --pinkbg:#FFF0F5; --line:#BFBFBF;
  --start:#3a9b3a; --start2:#2a7d2a; --tray:#1290e8;
  --task-h:44px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);overflow:hidden;font-family:"PS2P",monospace;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.px{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---------- обои ---------- */
#wall{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}

/* ---------- иконки ---------- */
#desk{position:fixed;top:0;left:0;right:0;bottom:var(--task-h);
  padding-top:max(14px, env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,100px);grid-auto-columns:96px;gap:6px 10px;align-content:start}
.ico{all:unset;box-sizing:border-box;width:96px;height:100px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 2px;cursor:pointer;position:relative;border:1px dashed transparent}
.ico .pic{position:relative;height:48px;display:flex;align-items:flex-end}
.ico img{display:block}
.ico .lbl{font-size:9px;line-height:13px;color:#fff;text-align:center;text-shadow:1px 1px 0 #000,2px 2px 0 rgba(0,0,0,.35);padding:1px 3px;word-break:break-word}
.ico .num{position:absolute;right:-6px;bottom:-4px;background:var(--accent);color:#fff;font-size:9px;line-height:9px;padding:3px 3px 2px;box-shadow:0 0 0 2px #fff,0 0 0 4px #2a1f2d}
.ico:hover .lbl,.ico:focus-visible .lbl,.ico.sel .lbl{background:#2457c9}
.ico:focus-visible{border-color:#fff}
.ico:active .pic{transform:translateY(1px)}

/* ---------- окна ---------- */
#wins{position:fixed;inset:0 0 var(--task-h) 0;pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;pointer-events:auto;background:var(--face);
  border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--tbHi),6px 6px 0 rgba(10,20,60,.35);min-width:280px;min-height:180px;
  animation:pop .16s steps(4) both}
@keyframes pop{from{transform:scale(.88);opacity:.2}to{transform:none;opacity:1}}
.win.closing{animation:shut .14s steps(3) both}
@keyframes shut{to{transform:scale(.9);opacity:0}}
.win.inactive .tbar{background:linear-gradient(#8aa7e3,#7895d6);}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;box-shadow:none}
.tbar{flex:none;height:34px;display:flex;align-items:center;gap:8px;padding:0 5px 0 8px;color:#fff;cursor:default;touch-action:none;
  background:repeating-linear-gradient(180deg,var(--tbHi) 0 3px,var(--tb1) 3px 9px,var(--tb2) 9px 34px)}
.tbar img{flex:none}
.tbar .tt{flex:1;min-width:0;font-size:10px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:1px 1px 0 #0a2a7a}
.ctl{display:flex;gap:3px;flex:none}
.ctl button{all:unset;box-sizing:border-box;width:24px;height:24px;display:grid;place-items:center;cursor:pointer;background:#3b78ee;border:2px solid #fff;box-shadow:inset -2px -2px 0 #1d4fc0}
.ctl button:active{box-shadow:inset 2px 2px 0 #1d4fc0}
.ctl .cl{background:#e2522e;box-shadow:inset -2px -2px 0 #a8321a}
.ctl .cl:active{box-shadow:inset 2px 2px 0 #a8321a}
.ctl i{display:block;background:#fff}

<h1>Мой кейс: промо-кампания сериала «Горнолыжка»</h1>
<p><b>Ссылка на кейс:</b> <a href="https://www.behance.net/gallery/246542187/gornolyzhka-kreativnaja-koncepcija-prodvizhenija-seriala" target="_blank" rel="noopener">Behance</a></p>
<p>В рамках финального проекта по предмету «Креативное мышление для управления проектами» наша команда решила выйти на реального заказчика с предложением бесплатно решить любую его креативную задачу. Откликнулась кинокомпания <b>1-2-3 Production</b>: она снимает для ТНТ и PREMIER комедийный сериал «Горнолыжка», премьера которого запланирована на 2026 год.</p>
<p><b>Задачей было</b> разработать креативную концепцию офлайн-мероприятий для продвижения сериала. Перед началом мы зафиксировали три требования:</p>
<ul>
<li>событие должно передавать атмосферу и юмор сериала (сериал о жизни на горнолыжном курорте Архыз);</li>
<li>оно должно работать как промо-инструмент: усиливать узнаваемость и давать органический охват за счёт UGC;</li>
<li>механика должна объяснять, как гость мероприятия превращается в зрителя.</li>
</ul>
<p>Я отвечала непосредственно за креативную концепцию: работала над идеей и механикой всей промо-кампании, помогала с концепцией премьерного мероприятия, а ещё визуализировала все идеи и собрала итоговую презентацию для заказчика.</p>
<h2>Что сделали</h2>
<p><b>Проанализировали аудиторию:</b> Ориентировались на зрителей 26–39 лет из крупных городов, преимущественно женщин. Они смотрят лёгкие сериалы на стримингах, доверяют блогерам и охотно делятся впечатлениями. Отсюда вывод: событие должно быть визуальным, чтобы его хотелось снять.</p>
<p><b>Главный инсайт.</b> Запланированное промо выпадало на тёплый сезон, поэтому прямые решения со снегом не работали. Однако отсутствие снега я превратила в главную идею кампании: она построена на контрасте «зима в городе» и разбита на три этапа.</p>
<ol>
<li><b>За 3 недели до премьеры – интрига.</b> Лыжные следы на асфальте, сугробы из искусственного снега посреди летнего города, таблички «Скоро станет холоднее» с QR-кодом на соцсети проекта. Так в кампанию вовлекаются не только подписчики, но и случайные прохожие.</li>
<li><b>За 2 недели – pop-up.</b> Après-ski зоны в парках и на набережных с мороженым в форме сосулек и лыж и фотогеничной средой. Следы на асфальте ведут к точкам, где есть QR-код на тизер и промокод на PREMIER – прямая связка «прохожий → зритель».</li>
<li><b>Премьера – иммерсивное событие.</b> Гости (журналисты, актёры, звёздные друзья канала, активные подписчики) проходят путь горнолыжника: ski-pass на входе, открытие в формате <b>«Снежного стендапа»</b> от съёмочной команды, показ первой серии, караоке по саундтрекам и мерч на выходе. Каждый этап рассчитан на то, чтобы гости снимали контент.</li>
</ol>
<h2>Результат</h2>
<p>Заказчик утвердил концепцию с минимальными правками и написал, что действительно возьмет её в работу. Утвердили площадку, концепцию «Снежного стендапа», фотозоны, ски-пассы, розыгрыши, караоке и тайминг.</p>
<p class="callout">«Концепция мероприятия понравилась, берём в работу. Очень понравилась общая идея “Снежного стендапа” и погружения в атмосферу сериала через юмор и горнолыжную айдентику!» — Любовь Лисовская, руководитель digital-маркетинга 1-2-3 Production</p>
<h2>Почему я горжусь этим кейсом</h2>
<p>Этот кейс научил меня превращать ограничение в идею — отсутствие реального снега стало основой всей кампании. Горжусь тем, что концепцию оценил не преподаватель, а реальный заказчик из индустрии. Сейчас, наверное, я бы усилила PR-часть: подготовила пресс-релиз к премьере, пригласила журналистов на этап с сугробами посреди лета и усилила бы онлайн-часть, чтобы офлайн-активации жили дольше одного дня. И всё же это был мой первый настоящий спецпроект, который дошёл до реального заказчика и получил одобрение.</p>

/* ====== Пиксельный рабочий стол: обои, иконки, окна, звук, игра ====== */

/* ---------- картинки из пиксельных сеток ---------- */
const big=(c,k)=>{const b=document.createElement('canvas');b.width=c.width*k;b.height=c.height*k;const x=b.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(c,0,0,b.width,b.height);return b.toDataURL()};

function iconSize(name,k=3){const r=ICONS[name];return{w:(Math.max(...r.map(s=>s.length))+2)*k,h:(r.length+2)*k}}

const DARK=new Set(['K','H','h','Z','n','J','j','D']);
function buildMono(rows){const h=rows.length,w=Math.max(...rows.map(r=>r.length));const c=document.createElement('canvas');c.width=w+2;c.height=h+2;const x=c.getContext('2d');
  const at=(i,j)=>{const r=rows[j];return r?(r[i]||'.'):'.'};
  x.fillStyle='#111114';for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){if(at(i,j)!=='.')continue;if([[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>{const v=at(i+a,j+b);return v!=='.'&&v!=='T'}))x.fillRect(i+1,j+1,1,1)}
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=at(i,j);if(ch==='.')continue;x.fillStyle=ch==='Y'||ch==='y'?'#ffe14d':DARK.has(ch)?'#111114':'#ffffff';x.fillRect(i+1,j+1,1,1)}

function tone(f,t0,dur,{type='square',vol=.08,to=null,att=.005}={}){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type;
  const t=a.currentTime+t0;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(t0,dur,vol=.12){const a=ac();if(!a||muted)return;const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);

/* ---------- обои: небо, облака, холм — генерируются пиксельно ---------- */
const wall=$('#wall'),wx=wall.getContext('2d');

const SKY=['#2a63d4','#3170db','#3a7fe0','#4890e6','#58a0ec','#6cb1f1','#83c1f5','#9dd0f8'].map(hex);
const HILL=['#7fe05a','#62cc45','#4db83a','#3aa232','#2d8c2b'].map(hex);
const BACK=['#5fb84a','#4ea53f'].map(hex);
function drawWall(){
  const P=mobile()?3:4,W=Math.ceil(innerWidth/P),H=Math.ceil(innerHeight/P);wall.width=W;wall.height=H;
  const im=wx.createImageData(W,H),d=im.data,r=rng(20260);
  const put=(x,y,c)=>{if(x<0||y<0||x>=W||y>=H)return;const i=(y*W+x)*4;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255};

  const clouds=[];const n=Math.max(3,Math.round(W/70));
  for(let i=0;i<n;i++){const cx=(i+.3+r()*.5)*W/n,cy=H*(.08+r()*.32),s=(mobile()?.7:1)*(7+r()*7);const parts=[];
    const m=3+Math.floor(r()*3);for(let j=0;j<m;j++)parts.push([cx+(j-(m-1)/2)*s*1.15+(r()-.5)*s*.5,cy-(r()*s*.7),s*(.75+r()*.55)]);clouds.push({cy,parts,s})}
  clouds.forEach(c=>{const minx=Math.floor(Math.min(...c.parts.map(p=>p[0]-p[2]))),maxx=Math.ceil(Math.max(...c.parts.map(p=>p[0]+p[2])));
    const miny=Math.floor(Math.min(...c.parts.map(p=>p[1]-p[2]))),base=Math.round(c.cy+c.s*.45);
    const inside=(x,y)=>y<=base&&c.parts.some(([px,py,pr])=>(x-px)**2+(y-py)**2<=pr*pr);
    for(let y=miny;y<=base;y++)for(let x=minx;x<=maxx;x++){if(!inside(x,y))continue;

  // дальний холм
  const back=x=>horizon-H*.05-Math.sin(x/W*Math.PI*1.3+.6)*H*.07;
  for(let x=0;x<W;x++){const top=Math.round(back(x));for(let y=top;y<H;y++)put(x,y,BACK[(y-top)>3||BAYER[y&3][x&3]>.6?1:0])}

  const cx=W*(mobile()?.55:.42),top=horizon-H*.01,k=(H*.5)/((W*.75)**2);

  // цветы
  const fl=[[255,255,255],[255,159,180],[255,225,77]];
  for(let i=0;i<W*H/260;i++){const x=Math.floor(r()*W),t0=hy(x),y=Math.floor(t0+3+r()*(H-t0));if(y>=H)continue;const c=fl[Math.floor(r()*3)];
    put(x,y,c);if(r()<.4){put(x-1,y,c);put(x+1,y,c);put(x,y-1,c);put(x,y+1,[255,210,63])}}
  wx.putImageData(im,0,0)}

const winsEl=$('#wins'),tasks=$('#tasks');
const W={};let z=10,cascade=0;
function open(id){const a=byId[id];if(!a)return;
  if(W[id]){const w=W[id];w.el.hidden=false;w.min=false;focus(id);sfx('click');return}
  const el=document.createElement('section');el.className='win';el.setAttribute('role','dialog');el.setAttribute('aria-label',a.title);

  el.querySelector('.wbody').appendChild($('#'+a.tpl).content.cloneNode(true));

  const vw=innerWidth,vh=innerHeight-44;const w=Math.min(a.w||860,vw-40),h=Math.min(a.h||Math.round(vh*.86),vh-24);
  const left=Math.max(8,Math.min(vw-w-8,(vw<1000?20:150)+cascade*28)),top=Math.max(8,Math.min(vh-h-8,16+cascade*24));cascade=(cascade+1)%7;
  Object.assign(el.style,{left:left+'px',top:top+'px',width:w+'px',height:h+'px'});
  winsEl.appendChild(el);
  const tb=document.createElement('button');tb.className='tbtn';tb.appendChild(img(a.icon,1));const ts=document.createElement('span');ts.textContent=a.label;tb.appendChild(ts);tb.setAttribute('aria-label',a.label);tasks.appendChild(tb);
  W[id]={el,tb,min:false};
  tb.addEventListener('click',()=>{const w=W[id];if(w.min||w.el.hidden){w.el.hidden=false;w.min=false;focus(id);sfx('click')}else if(top0()===id){minimize(id)}else focus(id)});
  el.addEventListener('pointerdown',()=>focus(id));
  el.querySelector('.cl').addEventListener('click',e=>{e.stopPropagation();close(id)});
  el.querySelector('.mn').addEventListener('click',e=>{e.stopPropagation();minimize(id)});
  el.querySelector('.mx').addEventListener('click',e=>{e.stopPropagation();el.classList.toggle('max');sfx('click');if(id==='web')GAME&&GAME.resize()});
  el.querySelector('.tbar').addEventListener('dblclick',e=>{if(e.target.closest('.ctl'))return;el.classList.toggle('max');if(id==='web')GAME&&GAME.resize()});
  drag(el);
  el.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copy(b)));
  if(id==='web')initGame(el);
  focus(id);sfx('open')}
function top0(){let best=null,bz=-1;for(const k in W){const w=W[k];if(!w.min&&!w.el.hidden&&+w.el.style.zIndex>bz){bz=+w.el.style.zIndex;best=k}}return best}
function focus(id){const w=W[id];if(!w)return;w.el.style.zIndex=++z;for(const k in W){W[k].el.classList.toggle('inactive',k!==id);W[k].tb.classList.toggle('on',k===id&&!W[k].min)}
  if(id==='web'&&GAME)GAME.wake()}
function minimize(id){const w=W[id];if(id==='web'&&GAME)GAME.pauseIfRunning();w.min=true;w.el.hidden=true;w.tb.classList.remove('on');sfx('min');const t=top0();if(t)focus(t)}
function close(id){const w=W[id];if(!w)return;delete W[id];w.tb.remove();sfx('close');if(id==='web'&&GAME){GAME.stop();GAME=null}
  w.el.classList.add('closing');setTimeout(()=>w.el.remove(),RM?0:150);const t=top0();if(t)focus(t);restartIdle()}
function drag(el){const bar=el.querySelector('.tbar');let sx,sy,ox,oy,on=false;
  bar.addEventListener('pointerdown',e=>{if(e.target.closest('.ctl')||mobile()||el.classList.contains('max'))return;on=true;sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;bar.setPointerCapture(e.pointerId)});
  bar.addEventListener('pointermove',e=>{if(!on)return;const nx=Math.max(-el.offsetWidth+120,Math.min(innerWidth-80,ox+e.clientX-sx)),ny=Math.max(0,Math.min(innerHeight-90,oy+e.clientY-sy));el.style.left=nx+'px';el.style.top=ny+'px'});
  const end=()=>{on=false};bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end)}
function copy(b){const el=document.getElementById(b.dataset.copy),t=el.textContent.trim();
  const ok=()=>{const o=b.textContent;b.textContent='Готово ✓';sfx('star');setTimeout(()=>b.textContent=o,1400)};
  const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText(t).then(ok,sel)}catch(e){sel()}}
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#idle').hidden){hideIdle();return}if(!$('#menu').hidden){toggleMenu(false);return}const t=top0();if(t)close(t)});

/* ---------- меню «Пуск» и панель ---------- */

function toggleMenu(v){const on=v===undefined?menu.hidden:v;if(on===!menu.hidden)return;menu.hidden=!on;startB.classList.toggle('on',on);startB.setAttribute('aria-expanded',on);if(on)sfx('menu')}

$('#logoimg').src=icon('logo',3);Object.assign($('#logoimg'),{width:21,height:21});

const sndimg=$('#sndimg');function setSnd(){sndimg.src=icon(muted?'mute':'speaker',2);Object.assign(sndimg,iconSize('speaker',2));$('#snd').setAttribute('aria-label',muted?'Включить звук':'Выключить звук')}
setSnd();$('#snd').addEventListener('click',()=>{muted=!muted;store.set('merei-os-mute',muted?'1':'0');setSnd();sfx('click')});
const clock=$('#clock');function tick(){const d=new Date();clock.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}tick();setInterval(tick,10000);

/* ---------- «долго ничего не нажимали» ---------- */
const IDLE_MS=20000;let idleT;const idleEl=$('#idle');
function anyOpen(){return Object.values(W).some(w=>!w.min)}
function showIdle(){if(anyOpen()||!$('#off').hidden||!menu.hidden){restartIdle();return}idleEl.hidden=false;const box=idleEl.querySelector('.win');box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');sfx('error');idleEl.querySelector('.xpbtn').focus({preventScroll:true})}

idleEl.addEventListener('click',e=>{if(e.target.closest('[data-idle-close]'))hideIdle()});
['pointerdown','keydown','wheel','touchstart'].forEach(ev=>addEventListener(ev,e=>{if(!idleEl.hidden&&!e.target.closest('#idle'))idleEl.hidden=true;restartIdle()},{passive:true,capture:true}));

/* ---------- мини-игра «Нет подключения» ---------- */
let GAME=null;
function initGame(win){
  const box=win.querySelector('.game'),cv=box.querySelector('canvas'),ctx=cv.getContext('2d');
  const BEST='merei-best-stars';let best=+store.get(BEST)||0;
  const spr={a:build(HERO.a),b:build(HERO.b),c:build(HERO.c),jump:build(HERO.jump),star:sprite('star')};
  const OB=EVIL.ground,FLY=EVIL.phone;
  const OS=3;let PX=2,PW,PH,SW,SH;
  let Wd=0,Hd=0,ground=0,last=0,raf=0,alive=true;
  const G={state:'idle',dist:0,speed:5,stars:0,level:1,lvlFlash:0,p:{x:40,y:0,vy:0,on:true,hold:false},obs:[],items:[],next:400,pebbles:[],flash:0};
  for(let i=0;i<34;i++)G.pebbles.push({x:Math.random()*900,dy:6+Math.floor(Math.random()*14),w:2+2*Math.floor(Math.random()*3)});
  function resize(){const r=cv.getBoundingClientRect(),D=Math.min(2,devicePixelRatio||1);if(!r.width)return;Wd=r.width;Hd=r.height;cv.width=Math.round(Wd*D);cv.height=Math.round(Hd*D);ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false;
    PX=Hd<240?1.8:2.2;PW=spr.a.width*PX;PH=spr.a.height*PX;SW=spr.star.width*2;SH=spr.star.height*2;
    ground=Hd-26;G.p.x=Wd<500?18:46;if(G.p.on)G.p.y=ground-PH}
  const ro=new ResizeObserver(resize);ro.observe(box);resize();
  const base=()=>Wd<500?4.2:5;
  function reset(){G.dist=0;G.speed=base();G.stars=0;G.level=1;G.lvlFlash=0;G.obs=[];G.items=[];G.next=Wd*.6;G.p.y=ground-PH;G.p.vy=0;G.p.on=true}
  function jump(){if(G.p.on){G.p.vy=-9.6;G.p.on=false;G.p.hold=true;G.p.air=0;G.p.cut=false;sfx('jump')}}
  function press(){if(G.state==='run'){jump();return}if(G.state==='pause'){G.state='run';return}reset();G.state='run';jump()}
  function release(){if(G.p.hold){G.p.hold=false;G.p.cut=true}}
  box.addEventListener('pointerdown',e=>{e.preventDefault();box.focus({preventScroll:true});press()});
  box.addEventListener('pointerup',release);box.addEventListener('pointercancel',release);
  const isTop=()=>top0()==='web'&&$('#idle').hidden;
  const kd=e=>{if(!(e.code==='Space'||e.key===' '||e.key==='ArrowUp'||e.key==='w'))return;if(!isTop())return;const t=e.target;if(t&&t!==box&&t.closest&&t.closest('a,button,input,textarea'))return;e.preventDefault();if(!e.repeat)press()};
  const ku=e=>{if(e.code==='Space'||e.key===' '||e.key==='ArrowUp'||e.key==='w')release()};
  addEventListener('keydown',kd);addEventListener('keyup',ku);
  const vis=()=>{if(document.hidden&&G.state==='run')G.state='pause'};document.addEventListener('visibilitychange',vis);
  function spawn(){const lv=G.level,r=Math.random();
    if(lv>=4&&r<.22){const hi=Math.random()<.5,t=FLY[0];G.obs.push({fly:true,t,x:Wd+10,y:hi?ground-PH-t.h*OS-8:ground-t.h*OS-6,f:0});
      G.items.push({x:Wd+10,y:hi?ground-SH-6:ground-t.h*OS-SH-40,b:0})}
    else if(r<.75){const pool=OB.filter(o=>o.lv<=lv);const t=pool[Math.floor(Math.random()*pool.length)];G.obs.push({t,x:Wd+10});
      if(Math.random()<.55)G.items.push({x:Wd+10+t.w*OS/2-SW/2,y:ground-t.h*OS-SH-26,b:0});
      if(lv>=3&&Math.random()<.25){const t2=OB[Math.floor(Math.random()*2)];G.obs.push({t:t2,x:Wd+10+t.w*OS+4})}
      else if(lv>=5&&Math.random()<.3){const t2=OB[Math.floor(Math.random()*2)];G.obs.push({t:t2,x:Wd+10+t.w*OS+150+G.speed*12})}}
    else{const n=1+Math.floor(Math.random()*3),hi=Math.random()<.5;for(let i=0;i<n;i++)G.items.push({x:Wd+10+i*(SW+14),y:ground-SH-6-(hi?50:0),b:Math.random()*6})}
    const k=Math.max(.55,1-(lv-1)*.07);G.next=Math.max(210,(Math.random()*260+300)*k*G.speed/5)}
  const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  function update(dt){const p=G.p;if(!p.on){p.air=(p.air||0)+dt;if(p.cut&&p.air>=9){p.cut=false;if(p.vy<-5.5)p.vy=-5.5}}p.vy+=(p.hold&&p.vy<0?.42:.6)*dt;p.y+=p.vy*dt;if(p.y>=ground-PH){p.y=ground-PH;p.vy=0;p.on=true}
    const lv=1+Math.floor(G.dist/3000);if(lv>G.level){G.level=lv;G.lvlFlash=90;sfx('level')}
    const target=Math.min(13,base()+(G.level-1)*.9+(G.dist%3000)/3000*.5);G.speed+=(target-G.speed)*.02*dt;
    const dx=G.speed*dt;G.dist+=dx;G.next-=dx;if(G.next<=0)spawn();
    const pb={x:p.x+PX*4,y:p.y+PX*3,w:PW-PX*8,h:PH-PX*4};
    G.obs.forEach(o=>{o.x-=o.fly?dx*1.15:dx;if(o.fly)o.f+=.25*dt});G.obs=G.obs.filter(o=>o.x>-80);
    for(const o of G.obs){const b=o.fly?{x:o.x+2*OS,y:o.y+3,w:(o.t.w-4)*OS,h:o.t.h*OS-6}:{x:o.x+3,y:ground-o.t.h*OS+3,w:o.t.w*OS-6,h:o.t.h*OS};if(hit(pb,b)){over();return}}
    G.items.forEach(s=>{s.x-=dx;s.b+=.08*dt});
    G.items=G.items.filter(s=>{if(s.x<-SW)return false;if(hit(pb,{x:s.x+3,y:s.y+3,w:SW-6,h:SH-6})){G.stars++;G.flash=12;sfx('star');return false}return true});
    if(G.flash>0)G.flash-=dt;if(G.lvlFlash>0)G.lvlFlash-=dt}
  function over(){G.state='over';sfx('crash');if(G.stars>best){best=G.stars;store.set(BEST,String(best))}}
  function txt(t,x,y,size,align,col){ctx.font=`${size}px "PS2P", monospace`;ctx.textAlign=align||'left';ctx.fillStyle=col||'#111114';ctx.fillText(t,x,y)}
  function grid(rows,x0,y0,s){for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++){const c=rows[j][i];if(c==='.')continue;ctx.fillStyle=c==='K'?'#111114':'#fff';ctx.fillRect(Math.round(x0)+i*s,Math.round(y0)+j*s,s,s)}}
  function draw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,Wd,Hd);
    ctx.fillStyle='#111114';ctx.fillRect(0,ground,Wd,2);const off=G.dist%900;
    G.pebbles.forEach(q=>{let x=q.x-off;if(x<-10)x+=900;if(x<Wd&&ground+q.dy<Hd)ctx.fillRect(Math.round(x),ground+q.dy,q.w,2)});
    G.obs.forEach(o=>o.fly?grid(FLY[Math.floor(o.f)%2].rows,o.x,o.y,OS):grid(o.t.rows,o.x,ground-o.t.h*OS,OS));
    if(G.state!=='over')G.items.forEach(s=>ctx.drawImage(spr.star,Math.round(s.x),Math.round(s.y+(RM?0:Math.sin(s.b)*2)),SW,SH));
    const p=G.p;const im=G.state==='run'?(!p.on?spr.jump:[spr.a,spr.b,spr.c,spr.b][Math.floor(G.dist/16)%4]):(G.state==='over'?spr.jump:spr.b);ctx.drawImage(im,Math.round(p.x),Math.round(p.y),PW,PH);
    const sm=Wd<520,fs=sm?9:11;
    ctx.drawImage(spr.star,12,10,sm?14:18,sm?14:18);
    txt(`${G.stars}`,sm?32:36,sm?22:26,sm?11:14,'left',G.flash>0?'#E8336F':'#111114');
    txt(`УР. ${G.level}`,Wd/2,sm?22:26,fs,'center','#111114');
    txt(`РЕКОРД ${best}`,Wd-12,sm?22:26,fs,'right','#6b6b75');
    if(G.lvlFlash>0&&G.state==='run'&&Math.floor(G.lvlFlash/8)%2===0)txt(`УРОВЕНЬ ${G.level}! БЫСТРЕЕ`,Wd/2,Hd*.3,sm?10:13,'center','#E8336F');
    if(G.state==='idle')banner('ЖМИ, ЧТОБЫ БЕЖАТЬ','собирай звёзды ★ и прыгай через препятствия');
    if(G.state==='pause')banner('ПАУЗА','пробел или тап — дальше');
    if(G.state==='over')banner('ИГРА ОКОНЧЕНА',`звёзд: ${G.stars} · рекорд: ${best} · ещё раз — тап`)}
  function banner(a,b){const sm=Wd<520,cx=Wd/2,cy=Math.max(54,Hd*.36);
    txt(a,cx,cy,sm?11:16,'center');ctx.font=`600 ${sm?11:13}px "Helvetica Neue",Helvetica,Arial,sans-serif`;const bw=Math.min(Wd-16,ctx.measureText(b).width+22);
    ctx.fillStyle='#ffe14d';ctx.fillRect(cx-bw/2,cy+12,bw,sm?24:28);ctx.fillStyle='#111114';ctx.textAlign='center';ctx.fillText(b,cx,cy+(sm?28:31))}
  function loop(t){if(!alive)return;const dt=Math.min(3,(t-last)/16.667||1);last=t;const shown=!win.hidden;
    if(G.state==='run'&&shown)update(dt);if(shown)draw();raf=requestAnimationFrame(loop)}
  (document.fonts&&document.fonts.load?document.fonts.load('12px "PS2P"'):Promise.resolve()).catch(()=>{}).then(()=>{raf=requestAnimationFrame(loop)});
  GAME={resize:()=>setTimeout(resize,30),wake(){},stop(){alive=false;cancelAnimationFrame(raf);ro.disconnect();removeEventListener('keydown',kd);removeEventListener('keyup',ku);document.removeEventListener('visibilitychange',vis)},
    pauseIfRunning(){if(G.state==='run')G.state='pause'},_G:G};
  setTimeout(()=>box.focus({preventScroll:true}),50);
}
})();
